<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur - Popups Aléatoires</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1557683316-9736b3061ae6?q=80&w=1920') center/cover no-repeat fixed;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Rectangle gris principal */
        .rect-gris {
            background-color: rgba(80, 80, 80, 0.92);
            padding: 40px 30px;
            border-radius: 25px;
            width: 550px;
            max-width: 95%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            text-align: center;
        }

        /* Rectangle gris foncé intérieur */
        .rect-fonce {
            background-color: #2c2c2e;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 5px 12px rgba(0,0,0,0.2);
        }

        .text-white {
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .title-note {
            font-size: 0.75rem;
            color: #ffaa66;
            margin-bottom: 20px;
            font-family: monospace;
        }

        /* Message d'erreur */
        .error-message {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            color: #ff6666;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .success-message {
            background-color: rgba(0, 255, 0, 0.15);
            border: 1px solid #44ff44;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            color: #aaffaa;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Bouton cercle */
        .btn-circle {
            background-color: #3a6ea5;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3);
            font-family: inherit;
            margin: 10px auto 0 auto;
            display: block;
        }

        .btn-circle:hover {
            background-color: #2c547c;
            transform: scale(1.02);
        }

        /* Flèche blanche */
        .arrow-down {
            display: flex;
            justify-content: center;
            margin: 15px 0 5px 0;
        }

        .arrow-svg {
            width: 50px;
            height: 50px;
        }

        .info-note {
            color: #cccccc;
            font-size: 0.7rem;
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .status-area {
            margin-top: 20px;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="rect-gris">
    <div class="rect-fonce">
        <div class="text-white">
            🎲 Générateur de sites aléatoires 🎲
        </div>
        <div class="title-note">
            ⚠️ Va ouvrir 60 sites web au hasard ⚠️
        </div>

        <!-- Zone de statut (succès/erreur) -->
        <div id="statusArea" class="status-area"></div>
    </div>

    <!-- Flèche blanche indiquant le bouton -->
    <div class="arrow-down">
        <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M12 19L19 12M12 19L5 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Bouton rond Click Here! -->
    <button class="btn-circle" id="clickBtn">Click Here!</button>
    
    <div class="info-note">
        🔓 Clique sur le bouton → autorise les popups → 60 sites s'ouvrent
    </div>
</div>

<script>
    // Liste de 60 sites inoffensifs (mèmes, blagues, jeux)
    const safeSites = [
        "https://theuselessweb.com/",

        "https://agar.io/",

        "https://littlealchemy.com/",

        "https://corndog.io/",

        "https://pornhub.com/",
        "https://pornhub.com/",

        "https://pornhub.com/",
        "https://pornhub.com/",
        "https://pornhub.com/",
        "https://pornhub.com/",

        "https://pornhub.com/",
        "https://pornhub.com/"
    ];

    // Fonction pour mélanger un tableau et prendre N éléments
    function getRandomSites(count) {
        const shuffled = [...safeSites];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
    }

    // Fonction pour ouvrir les sites
    function openRandomSites() {
        const sitesToOpen = getRandomSites(60);
        let openedCount = 0;

        for (let i = 0; i < sitesToOpen.length; i++) {
            const newWindow = window.open(sitesToOpen[i], "_blank");
            if (newWindow) {
                openedCount++;
            }
        }

        return openedCount;
    }

    // Fonction pour tester si les popups sont autorisés
    function arePopupsAllowed() {
        let testWindow = window.open("about:blank", "_blank");
        if (testWindow) {
            testWindow.close();
            return true;
        }
        return false;
    }

    // Effacer le message de statut
    function clearStatus() {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = "";
    }

    // Afficher une erreur en rouge
    function showError() {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = `
            <div class="error-message">
                ❌ Génération Failed ❌<br>
                Allow pop-ups and refresh the page
            </div>
        `;
    }

    // Afficher un message de succès
    function showSuccess(count) {
        const statusDiv = document.getElementById("statusArea");
        statusDiv.innerHTML = `
            <div class="success-message">
                ✅ Succès ! ${count} sites ouverts dans de nouveaux onglets ✅
            </div>
        `;
    }

    // Action principale au clic sur Click Here!
    document.getElementById("clickBtn").addEventListener("click", function() {
        clearStatus();
        
        // Vérifier si les popups sont autorisés
        if (arePopupsAllowed()) {
            // Popups autorisés → ouvrir les 60 sites
            const opened = openRandomSites();
            if (opened >= 8) {
                showSuccess(opened);
            } else {
                // Si moins de 8 se sont ouverts, problème partiel
                showError();
            }
        } else {
            // Popups bloqués → afficher l'erreur en rouge
            showError();
        }
    });
</script>
</body>
</html>
